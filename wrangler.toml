name = "rnd-number"
main = "src/index.js"
compatibility_date = "2026-01-01"

# CORS: set this to your actual Pages domain once deployed, e.g. "https://number-picker.pages.dev"
[vars]
ALLOWED_ORIGIN = "https://rnd-number.pages.dev"
NUM_MIN = "0"
NUM_MAX = "999999"
PAIR_TTL_SECONDS = "120"

[[d1_databases]]
binding = "DB"                  # accessed in code as env.DB
database_name = "number-picker-db"
database_id = "316117e1-327d-4db9-bad7-a83b58b816ea"

# Secret used to sign pair tokens. Do NOT put the real value here.
# Set it with: wrangler secret put TOKEN_SECRET
