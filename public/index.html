<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick a Number!</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
  </head>
  <body>
    <h1>Which number feels more random?</h1>
    <div class="pair">
      <button class="num" id="btnA">...</button>
      <button class="num" id="btnB">...</button>
    </div>
    <div id="status"></div>
    <div id="count">
      Responses this session: <span id="sessionCount">0</span>
    </div>

    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAAErNpwzdjnnmcvva"
      data-size="invisible"
      data-callback="onTurnstileSuccess"
    ></div>

    <script>
      // ---- CONFIG: point this at your deployed Worker ----
      const API_BASE = "https://rnd-number.jenseni.workers.dev";
      // -----------------------------------------------------

      const btnA = document.getElementById("btnA");
      const btnB = document.getElementById("btnB");
      const statusEl = document.getElementById("status");
      const sessionCountEl = document.getElementById("sessionCount");

      let currentToken = null;
      let sessionCount = 0;
      let turnstileToken = null;

      function onTurnstileSuccess(token) {
        turnstileToken = token;
      }

      function getSessionId() {
        let id = localStorage.getItem("np_session_id");
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem("np_session_id", id);
        }
        return id;
      }
      const sessionId = getSessionId();

      let errCount = 0;
      async function loadPair() {
        statusEl.textContent = "";
        btnA.disabled = true;
        btnB.disabled = true;
        btnA.textContent = "...";
        btnB.textContent = "...";

        try {
          const res = await fetch(`${API_BASE}/pair`);
          if (!res.ok) throw new Error("failed to load pair");
          const data = await res.json();

          currentToken = data.token;
          btnA.textContent = data.numA;
          btnB.textContent = data.numB;
          btnA.disabled = false;
          btnB.disabled = false;
          errCount = 0;
        } catch (err) {
          if (errCount > 0) {
            statusEl.textContent =
              "Error loading numbers. Try contacting the site owner if this keeps happening.";
            setTimeout(loadPair, 2000);
          } else {
            statusEl.textContent = "Couldn't load a pair - retrying";
          }
          errCount += 1;
        }
      }

      async function vote(choice) {
        if (!currentToken) return;
        if (!turnstileToken) {
          statusEl.textContent = "Still verifying, one sec...";
          return;
        }
        btnA.disabled = true;
        btnB.disabled = true;

        try {
          const res = await fetch(`${API_BASE}/vote`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              token: currentToken,
              choice,
              session_id: sessionId,
              turnstile_token: turnstileToken,
            }),
          });

          if (res.status === 409) {
            statusEl.textContent = "Pair expired, loading a new one.";
          } else if (res.status === 403) {
            statusEl.textContent = "Verification failed, retrying...";
          } else if (!res.ok) {
            throw new Error("vote failed");
          } else {
            sessionCount += 1;
            sessionCountEl.textContent = sessionCount;
          }
        } catch (err) {
          statusEl.textContent = "Vote failed. Please try again.";
        }

        loadPair();
      }

      btnA.addEventListener("click", () => vote(1));
      btnB.addEventListener("click", () => vote(2));

      loadPair();
    </script>
  </body>
</html>
