<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick a Number!</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
  </head>
  <body>
    <h1>Which number feels more random?</h1>
    <div class="pair">
      <button class="num" id="btnA">...</button>
      <button class="num" id="btnB">...</button>
    </div>
    <div id="status"></div>
    <div id="count">
      Responses this session: <span id="sessionCount">0</span>
    </div>

    <span
      title="This website is inspired by rngdle.com, and is a simple experiment to see which numbers people perceive as more random. The numbers are generated using a pseudo-random number generator, and the results are stored in a database. The goal is to see if there are any patterns in the numbers that people choose as more random."
      ><img id="infoIcon" src="images/info.png" alt="info icon" />What is this
      website?</span
    >

    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAAErNpwzdjnnmcvva"
      data-size="flexible"
      data-callback="onTurnstileSuccess"
      data-appearance="execute"
    ></div>
    <script src="js/index.js"></script>
  </body>
</html>
